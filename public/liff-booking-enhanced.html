<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>LINE予約システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            text-align: center;
            color: white;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .user-info {
            background: rgba(255,255,255,0.2);
            padding: 10px 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .returning-customer {
            background: #4CAF50;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin: 15px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        
        .returning-customer.show {
            display: flex;
        }
        
        .content {
            padding: 25px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-number {
            background: #667eea;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 25px;
        }
        
        .weekday {
            text-align: center;
            font-size: 12px;
            color: #666;
            padding: 8px;
        }
        
        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f7;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .day:hover:not(.disabled) {
            background: #e5e5e7;
        }
        
        .day.today {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }
        
        .day.selected {
            background: #667eea;
            color: white;
        }
        
        .day.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .time-slot {
            padding: 12px;
            background: #f5f5f7;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            position: relative;
        }
        
        /* 容量制限カラー（強制上書き・hover対策強化版） */
        .time-slot.is-limited,
        .time-slot.is-limited:hover,
        .time-slot.capacity-limited,
        .time-slot.capacity-limited:hover {
            background: linear-gradient(135deg, #ffb74d 0%, #ff9800 100%) !important;
            color: #111 !important;
            cursor: pointer !important;
        }
        
        .time-slot.is-full,
        .time-slot.is-full:hover,
        .time-slot.capacity-full,
        .time-slot.capacity-full:hover {
            background: linear-gradient(135deg, #ef5350 0%, #e53935 100%) !important;
            color: #fff !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
        }
        
        .time-slot.is-available,
        .time-slot.is-available:hover,
        .time-slot.capacity-available,
        .time-slot.capacity-available:hover {
            background: linear-gradient(135deg, #81c784 0%, #4caf50 100%) !important;
            color: #fff !important;
            cursor: pointer !important;
        }
        
        /* ホバーでグレーになる規則を限定解除 */
        .time-slot:hover:not(.is-limited):not(.is-full):not(.capacity-limited):not(.capacity-full):not(.selected) {
            background: #e5e5e7;
        }
        
        .time-slot.selected {
            background: #667eea;
            color: white;
        }
        
        .time-slot.full {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
            color: white;
            cursor: not-allowed;
            opacity: 0.8;
        }
        
        .time-slot.limited {
            background: linear-gradient(135deg, #ffd54f 0%, #ffb300 100%);
            color: #333;
        }
        
        .time-slot.available {
            background: linear-gradient(135deg, #81c784 0%, #4caf50 100%);
            color: white;
        }
        
        .capacity-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4444;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .required {
            color: #ff4444;
            font-size: 12px;
            margin-left: 4px;
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e5e7;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-input.error {
            border-color: #ff4444;
        }
        
        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        /* ★ 容量状態のCSSクラス */
        .capacity-full {
            background: #dc3545 !important;
            color: #fff !important;
        }
        
        .capacity-limited {
            background: #ffc107 !important;
            color: #000 !important;
        }
        
        .capacity-available {
            background: #28a745 !important;
            color: #fff !important;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .success-message {
            background: #4CAF50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px;
        }
        
        .info-saved {
            background: #e3f2fd;
            color: #1976d2;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
        
        .info-saved.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ レストラン予約</h1>
            <div class="user-info" id="userInfo" style="display: none;">
                <div class="user-avatar" id="userAvatar">👤</div>
                <div class="user-name" id="userName">ゲスト</div>
            </div>
        </div>
        
        <div class="returning-customer" id="returningCustomer">
            <span>✨ おかえりなさい！前回の情報を自動入力しました</span>
        </div>
        
        <div class="loading" id="loading">
            <div>読み込み中...</div>
        </div>
        
        <div class="content" id="bookingForm" style="display: none;">
            <form id="reservationForm" onsubmit="return false;">
                <!-- Step 1: 日付選択 -->
                <div class="section-title">
                    <span class="section-number">1</span>
                    日付を選択
                </div>
                <div class="calendar-grid" id="calendar"></div>
                <input type="hidden" id="selectedDate">
                
                <!-- Step 2: 時間選択 -->
                <div class="section-title">
                    <span class="section-number">2</span>
                    時間を選択
                </div>
                <!-- 容量状態の凡例 -->
                <div style="display: flex; gap: 8px; margin-bottom: 15px; padding: 10px; background: #f8f9fa; border-radius: 8px; flex-wrap: wrap; font-size: 12px;">
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <div style="width: 16px; height: 16px; background: linear-gradient(135deg, #81c784 0%, #4caf50 100%); border-radius: 3px;"></div>
                        <span style="color: #666;">空席あり</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <div style="width: 16px; height: 16px; background: linear-gradient(135deg, #ffd54f 0%, #ffb300 100%); border-radius: 3px;"></div>
                        <span style="color: #666;">残りわずか</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <div style="width: 16px; height: 16px; background: linear-gradient(135deg, #ffb74d 0%, #ff9800 100%); border-radius: 3px;"></div>
                        <span style="color: #666;">もうすぐ満席</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <div style="width: 16px; height: 16px; background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%); border-radius: 3px;"></div>
                        <span style="color: #666;">満席</span>
                    </div>
                </div>
                <div class="time-slots" id="timeSlots"></div>
                <input type="hidden" id="selectedTime">
                
                <!-- Step 3: お客様情報 -->
                <div class="section-title">
                    <span class="section-number">3</span>
                    お客様情報
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        お名前 <span class="required">*必須</span>
                    </label>
                    <input type="text" class="form-input" id="customerName" placeholder="山田太郎" required>
                    <div class="error-message" id="nameError">お名前を入力してください</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        電話番号 <span class="required">*必須</span>
                    </label>
                    <input type="tel" class="form-input" id="phone" placeholder="090-1234-5678" required pattern="[0-9\-\+]+">
                    <div class="error-message" id="phoneError">電話番号を正しく入力してください</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">メールアドレス（任意）</label>
                    <input type="email" class="form-input" id="email" placeholder="example@email.com">
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        人数 <span class="required">*必須</span>
                    </label>
                    <select class="form-select" id="people" required>
                        <option value="">選択してください</option>
                        <option value="1">1名</option>
                        <option value="2">2名</option>
                        <option value="3">3名</option>
                        <option value="4">4名</option>
                        <option value="5">5名</option>
                        <option value="6">6名</option>
                        <option value="7">7名</option>
                        <option value="8">8名</option>
                    </select>
                    <div class="error-message" id="peopleError">人数を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">ご要望（任意）</label>
                    <textarea class="form-textarea" id="message" rows="3" placeholder="アレルギーやご要望があればお書きください"></textarea>
                </div>
                
                <div class="info-saved" id="infoSaved">
                    ✅ お客様情報を記憶しました。次回は自動入力されます。
                </div>
                
                <button type="button" class="submit-btn" id="submitBtn">
                    予約を確定する
                </button>
            </form>
        </div>
        
        <div class="success-message" id="successMessage" style="display: none;">
            <h2>✅ ご予約完了</h2>
            <p id="confirmationDetails"></p>
            <p id="seatDetails" style="margin-top: 10px; font-weight: bold; color: #667eea;"></p>
        </div>
    </div>
    
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src='/js/runtime-config.js' defer></script>
    <script src='/js/liff-booking-page.14320df4.js' defer></script>

    <!-- CSS読み込み -->
    <link rel='stylesheet' href='/css/hamburger-left-fix.css'>
    <link rel='stylesheet' href='/css/sidemenu-style.css'>
    <!-- 共通ハンバーガーメニューJS -->
    <!-- LIFF画面にはサイドバーメニュー不要 -->
</body>
</html>
