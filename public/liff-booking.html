<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE予約システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
            background: linear-gradient(135deg, #06c755 0%, #05a548 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header {
            background: linear-gradient(135deg, #06c755 0%, #05a548 100%);
            padding: 20px;
            text-align: center;
            color: white;
        }
        
        .header h1 {
            font-size: 22px;
            font-weight: 600;
        }
        
        .content {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .required {
            color: #e74c3c;
        }
        
        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #06c755;
            box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.1);
        }
        
        .date-select {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .date-option {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }
        
        .date-option:hover {
            border-color: #06c755;
            background: #f0fff4;
        }
        
        .date-option.selected {
            background: #06c755;
            color: white;
            border-color: #06c755;
        }
        
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }
        
        .time-slot {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            background: white;
        }
        
        .time-slot.disabled {
            background: #f5f5f5;
            color: #999;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .time-slot.slot-full {
            background: #f8f9fa !important;
            border-color: #dee2e6 !important;
            pointer-events: none;
        }
        
        .time-slot.slot-limited {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        .time-slot:hover:not(.disabled) {
            border-color: #06c755;
            background: #f0fff4;
        }
        
        .time-slot.selected {
            background: #06c755;
            color: white;
            border-color: #06c755;
        }
        
        .time-slot.disabled {
            background: #f5f5f5;
            color: #999;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #06c755 0%, #05a548 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(6, 199, 85, 0.3);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #06c755;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        
        .success-message.show {
            display: block;
        }
        
        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        
        .error-message.show {
            display: block;
        }
        
        .user-info {
            background: rgba(255,255,255,0.2);
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            color: white;
            font-size: 14px;
        }
    </style>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 予約フォーム</h1>
            <div class="user-info" id="userInfo" style="display: none;">
                <span id="userName"></span>
            </div>
        </div>
        
        <div class="content">
            <form id="reservationForm">
                <!-- お名前 -->
                <div class="form-group">
                    <label class="form-label">
                        お名前 <span class="required">*</span>
                    </label>
                    <input type="text" class="form-control" id="customerName" required>
                </div>
                
                <!-- 日付選択 -->
                <div class="form-group">
                    <label class="form-label">
                        日付 <span class="required">*</span>
                    </label>
                    <div class="date-select" id="dateSelect">
                        <!-- 動的に生成 -->
                    </div>
                    <input type="hidden" id="selectedDate">
                </div>
                
                <!-- 時間選択 -->
                <div class="form-group">
                    <label class="form-label">
                        時間 <span class="required">*</span>
                    </label>
                    <div class="time-slots" id="timeSlots">
                        <!-- 動的に生成 -->
                    </div>
                    <input type="hidden" id="selectedTime">
                </div>
                
                <!-- 人数 -->
                <div class="form-group">
                    <label class="form-label">
                        人数 <span class="required">*</span>
                    </label>
                    <select class="form-control" id="people" required>
                        <option value="">選択してください</option>
                        <option value="1">1名</option>
                        <option value="2">2名</option>
                        <option value="3">3名</option>
                        <option value="4">4名</option>
                        <option value="5">5名</option>
                        <option value="6">6名</option>
                        <option value="7">7名</option>
                        <option value="8">8名</option>
                        <option value="9">9名</option>
                        <option value="10">10名</option>
                    </select>
                </div>
                
                <!-- 電話番号 -->
                <div class="form-group">
                    <label class="form-label">電話番号</label>
                    <input type="tel" class="form-control" id="phone" placeholder="090-1234-5678">
                </div>
                
                <!-- メッセージ -->
                <div class="form-group">
                    <label class="form-label">メッセージ</label>
                    <textarea class="form-control" id="message" rows="3" placeholder="アレルギーや要望など"></textarea>
                </div>
                
                <!-- 送信ボタン -->
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    予約を確定する
                </button>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>処理中...</p>
            </div>
            
            <div class="success-message" id="successMessage">
                ✅ 予約が完了しました！
            </div>
            
            <div class="error-message" id="errorMessage">
                エラーが発生しました
            </div>
        </div>
    </div>
    
    <script>
        let liffInitialized = false;
        let userProfile = null;
        
        // 日付選択肢を生成
        function generateDates() {
            const dateSelect = document.getElementById('dateSelect');
            const today = new Date();
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                
                const dateOption = document.createElement('div');
                dateOption.className = 'date-option';
                dateOption.dataset.date = date.toISOString().split('T')[0];
                
                const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
                const dayName = dayNames[date.getDay()];
                
                dateOption.innerHTML = `
                    <div style="font-size: 12px; color: #666;">${date.getMonth() + 1}月</div>
                    <div style="font-size: 18px; font-weight: bold;">${date.getDate()}</div>
                    <div style="font-size: 12px; color: #666;">${dayName}</div>
                `;
                
                dateOption.addEventListener('click', () => selectDate(dateOption));
                dateSelect.appendChild(dateOption);
            }
        }
        
        // 日付選択
        function selectDate(element) {
            document.querySelectorAll('.date-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            document.getElementById('selectedDate').value = element.dataset.date;
            
            // 時間枠を取得
            loadTimeSlots(element.dataset.date);
        }
        
        // 時間枠を読み込み（容量チェック付き）
        async function loadTimeSlots(date) {
            const timeSlotsDiv = document.getElementById('timeSlots');
            timeSlotsDiv.innerHTML = '<div style="text-align: center; padding: 20px;">読み込み中...</div>';
            
            try {
                // 容量状態を取得
                const capacityResponse = await fetch(`/api/capacity-availability?date=${date}&store_id=${window.STORE_ID || '***REMOVED-ROTATE-CREDENTIAL***'}`);
                const capacityData = await capacityResponse.json();
                
                console.log('[LIFF] Capacity data received:', capacityData);
                
                timeSlotsDiv.innerHTML = '';
                
                // デフォルトの時間枠
                const defaultTimes = ['11:00', '11:30', '12:00', '12:30', '13:00', '13:30', 
                              '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', 
                              '17:00', '17:30', '18:00', '18:30', '19:00', '19:30', 
                              '20:00', '20:30'];
                
                const times = (slotsData.ok && slotsData.slots) ? 
                    slotsData.slots.map(s => s.time) : defaultTimes;
                
                times.forEach(time => {
                    const timeSlot = document.createElement('div');
                    timeSlot.className = 'time-slot';
                    timeSlot.dataset.time = time;
                    
                    // 容量状態をチェック
                    let capacityStatus = null;
                    if (capacityData.ok && capacityData.slots) {
                        capacityStatus = capacityData.slots[time];
                        console.log(`[LIFF] Time ${time} capacity status:`, capacityStatus);
                    }
                    
                    // 容量に基づいてスタイルを設定
                    if (capacityStatus) {
                        if (capacityStatus.status === 'full') {
                            timeSlot.classList.add('disabled', 'slot-full');
                            timeSlot.innerHTML = `${time}<br><small style="color: #dc3545;">満席</small>`;
                            timeSlot.style.backgroundColor = '#f8f9fa';
                            timeSlot.style.color = '#6c757d';
                            timeSlot.style.cursor = 'not-allowed';
                            timeSlot.style.opacity = '0.6';
                        } else if (capacityStatus.status === 'limited') {
                            timeSlot.classList.add('slot-limited');
                            timeSlot.innerHTML = `${time}<br><small style="color: #ffc107;">🔶 残り${capacityStatus.available}組</small>`;
                            timeSlot.style.backgroundColor = '#fff3cd';
                            timeSlot.style.borderColor = '#ffc107';
                            timeSlot.addEventListener('click', () => selectTime(timeSlot));
                        } else if (capacityStatus.status === 'available') {
                            timeSlot.innerHTML = `${time}<br><small style="color: #28a745;">○ 空席あり</small>`;
                            timeSlot.style.backgroundColor = '#d4edda';
                            timeSlot.style.borderColor = '#28a745';
                            timeSlot.addEventListener('click', () => selectTime(timeSlot));
                        } else {
                            timeSlot.textContent = time;
                            timeSlot.addEventListener('click', () => selectTime(timeSlot));
                        }
                    } else {
                        // APIからの応答がない場合は通常表示
                        timeSlot.textContent = time;
                        timeSlot.addEventListener('click', () => selectTime(timeSlot));
                    }
                    
                    timeSlotsDiv.appendChild(timeSlot);
                });
                }
            } catch (error) {
                console.error('Failed to load time slots:', error);
                // エラー時はデフォルト表示
                const times = ['11:00', '11:30', '12:00', '12:30', '13:00', '13:30', 
                              '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', 
                              '17:00', '17:30', '18:00', '18:30', '19:00', '19:30', 
                              '20:00', '20:30'];
                
                timeSlotsDiv.innerHTML = '';
                times.forEach(time => {
                    const timeSlot = document.createElement('div');
                    timeSlot.className = 'time-slot';
                    timeSlot.dataset.time = time;
                    timeSlot.textContent = time;
                    timeSlot.addEventListener('click', () => selectTime(timeSlot));
                    timeSlotsDiv.appendChild(timeSlot);
                });
            }
        }
        
        // 時間選択
        function selectTime(element) {
            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.classList.remove('selected');
            });
            element.classList.add('selected');
            document.getElementById('selectedTime').value = element.dataset.time;
        }
        
        // LIFF初期化
        async function initializeLiff() {
            try {
                await liff.init({ 
                    liffId: '2006487876-Xd1A5qJB'  // 大文字のXに修正
                });
                
                liffInitialized = true;
                
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userProfile = profile;
                    
                    // ユーザー情報を表示
                    document.getElementById('userInfo').style.display = 'block';
                    document.getElementById('userName').textContent = `こんにちは、${profile.displayName}さん`;
                    document.getElementById('customerName').value = profile.displayName;
                }
            } catch (error) {
                console.error('LIFF initialization failed:', error);
            }
        }
        
        // フォーム送信
        document.getElementById('reservationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const date = document.getElementById('selectedDate').value;
            const time = document.getElementById('selectedTime').value;
            const customerName = document.getElementById('customerName').value;
            const people = document.getElementById('people').value;
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;
            
            if (!date || !time || !customerName || !people) {
                alert('必須項目を入力してください');
                return;
            }
            
            // ローディング表示
            document.getElementById('loading').classList.add('show');
            document.getElementById('submitBtn').disabled = true;
            
            try {
                const response = await fetch('/api/reservation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        date,
                        time,
                        customer_name: customerName,
                        people,
                        phone,
                        message
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('loading').classList.remove('show');
                    document.getElementById('successMessage').classList.add('show');
                    
                    // LINEアプリに戻る
                    setTimeout(() => {
                        if (liffInitialized && liff.isInClient()) {
                            liff.closeWindow();
                        }
                    }, 2000);
                } else {
                    throw new Error(result.error || '予約に失敗しました');
                }
            } catch (error) {
                console.error('Reservation error:', error);
                document.getElementById('loading').classList.remove('show');
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('errorMessage').classList.add('show');
                document.getElementById('submitBtn').disabled = false;
            }
        });
        
        // 初期化
        window.addEventListener('DOMContentLoaded', () => {
            generateDates();
            initializeLiff();
        });
    </script>
</body>
</html>
