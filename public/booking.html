<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>予約フォーム</title>
  <link rel="stylesheet" href="/css/booking.css" />
  <script src="/js/booking.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>予約確認</h1>
    <section class="summary">
      <p id="summary-text">読み込み中...</p>
    </section>

    <section class="form">
      <form id="booking-form" novalidate>
        <div class="field">
          <label for="name">お名前 <span class="req">*</span></label>
          <input id="name" name="name" type="text" autocomplete="name" required />
          <div class="err" id="err-name" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="tel">電話番号 <span class="req">*</span></label>
          <input id="tel" name="tel" type="tel" inputmode="tel" placeholder="09012345678" required />
          <div class="err" id="err-tel" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="note">備考</label>
          <textarea id="note" name="note" rows="3"></textarea>
        </div>

        <div class="field agree">
          <label><input id="agree" type="checkbox" /> 利用規約に同意します</label>
          <div class="err" id="err-agree" aria-live="polite"></div>
        </div>

        <button id="submit" type="submit" class="primary">この内容で予約する</button>
        <div id="result" class="result" aria-live="polite"></div>
      </form>
    </section>
  </main>
</body>
</html>
